apiVersion: apps/v1
kind: Deployment
metadata:
  name: voce-app
  namespace: voce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voce-app
  template:
    metadata:
      labels:
        app: voce-app
    spec:
      containers:
        - name: voce-app
          image: voce-ai:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voce-secrets
                  key: OPENROUTER_API_KEY
            - name: OPENROUTER_MODEL
              value: "deepseek/deepseek-r1"
            - name: OPENROUTER_INPUT_COST_PER_MILLION
              value: "0"
            - name: OPENROUTER_OUTPUT_COST_PER_MILLION
              value: "0"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voce-secrets
                  key: GROQ_API_KEY
            - name: ASSEMBLY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voce-secrets
                  key: ASSEMBLY_API_KEY
            - name: ELEVENLABS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: voce-secrets
                  key: ELEVENLABS_API_KEY
            - name: ELEVENLABS_VOICE_ID
              value: "JBFqnCBsd6RMkjVDRZzb"
            - name: NEXT_PUBLIC_CONVEX_URL
              valueFrom:
                secretKeyRef:
                  name: voce-secrets
                  key: NEXT_PUBLIC_CONVEX_URL

