apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: voce
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: "voce_app"
        metrics_path: "/api/metrics"
        static_configs:
          - targets: ["voce-app:3000"]

